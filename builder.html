<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社交策展名片 · 生成器</title>
<style>
  :root{--ui:#1f2937;--ui2:#374151;--line:#e5e7eb;--bg:#f3f4f6;--ac:#2563eb;--mut:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ui);font-size:14px;line-height:1.5}
  header{padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  header h1{font-size:16px}
  header .sub{color:var(--mut);font-size:12px}
  .themes{display:flex;gap:6px;flex-wrap:wrap}
  .themes button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ui)}
  .themes button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
  .actions{margin-left:auto;display:flex;gap:8px}
  .actions button{border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
  .btn-load{background:#eef2ff;color:#3730a3}
  .btn-dl{background:var(--ac);color:#fff}
  .wrap{display:flex;gap:0;align-items:stretch;height:calc(100vh - 56px)}
  .panel{width:380px;max-width:42vw;overflow:auto;background:#fff;border-right:1px solid var(--line);padding:14px}
  .preview{flex:1;background:#52525b;display:flex;flex-direction:column}
  .preview iframe{flex:1;width:100%;border:none;background:#fff}
  details{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
  details>summary{padding:10px 12px;background:#f9fafb;cursor:pointer;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
  details[open]>summary{border-bottom:1px solid var(--line)}
  .body{padding:10px 12px}
  .fld{margin-bottom:8px}
  .fld label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
  .fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;font-family:inherit}
  .fld textarea{resize:vertical;min-height:42px}
  .row{display:grid;gap:6px;margin-bottom:8px;padding:8px;border:1px dashed var(--line);border-radius:8px}
  .row .rg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .row .rg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .row .del{font-size:11px;color:#dc2626;cursor:pointer;text-align:right}
  .add{font-size:12px;color:var(--ac);cursor:pointer;background:none;border:none;padding:4px}
  .hint{font-size:11px;color:var(--mut);padding:4px 0}
</style>
</head>
<body>
<header>
  <div>
    <h1>社交策展名片 · 生成器</h1>
    <div class="sub">填资料 → 选主题 → 下载单文件 H5（零外链·可发微信·可挂任意托管）</div>
  </div>
  <div class="themes" id="themes"></div>
  <div class="actions">
    <button class="btn-load" id="loadDemo">载入示例</button>
    <button class="btn-dl" id="download">下载 HTML</button>
  </div>
</header>
<div class="wrap">
  <div class="panel" id="form"></div>
  <div class="preview"><iframe id="pv" title="预览"></iframe></div>
</div>

<script>
/* ---------- 主题（6 套，架构各异） ---------- */
const THEMES=[
 {id:"creative_light",name:"画廊风",cn:"Creative_Light",layout:"A",bg:"#f6f1e7",surface:"#fffdf8",ink:"#2b2620",muted:"#8a7f6d",accent:"#c8861d",accent2:"#1f4032",line:"#e3d9c4",tag:"#f0e6d2",radius:"18px",font:"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"},
 {id:"midnight_ink",name:"深夜墨稿",cn:"Midnight_Ink",layout:"B",bg:"#0f1419",surface:"#161d26",ink:"#e8e6df",muted:"#8b94a0",accent:"#c0392b",accent2:"#e8e6df",line:"#26303c",tag:"#1d2630",radius:"10px",font:"'Songti SC',Georgia,'PingFang SC',serif"},
 {id:"bento_mono",name:"极简模块",cn:"Bento_Mono",layout:"C",bg:"#0e0e0e",surface:"#1a1a1a",ink:"#f5f5f5",muted:"#888",accent:"#00ff9d",accent2:"#ffffff",line:"#2a2a2a",tag:"#222",radius:"22px",font:"'Helvetica Neue','PingFang SC',sans-serif"},
 {id:"timeline_quest",name:"成长主线",cn:"Timeline_Quest",layout:"D",bg:"#efe6d3",surface:"#fbf6ea",ink:"#3a2e1f",muted:"#9a8869",accent:"#b5651d",accent2:"#3a2e1f",line:"#d8c7a3",tag:"#e7dcc2",radius:"12px",font:"'PingFang SC','Microsoft YaHei',sans-serif"},
 {id:"chat_me",name:"对话式",cn:"Chat_Me",layout:"E",bg:"#f2f2f2",surface:"#ffffff",ink:"#1a1a1a",muted:"#999",accent:"#07c160",accent2:"#576b95",line:"#e5e5e5",tag:"#eafaf1",radius:"20px",font:"'PingFang SC','Microsoft YaHei',sans-serif"},
 {id:"gallery_route",name:"展览路线",cn:"Gallery_Route",layout:"F",bg:"#f4f1ee",surface:"#fff",ink:"#33312e",muted:"#a39b92",accent:"#7c93a6",accent2:"#c9a9a6",line:"#e2dbd4",tag:"#ece6df",radius:"16px",font:"'PingFang SC','Microsoft YaHei',sans-serif"}
];
let CUR="creative_light";

/* ---------- 图标 ---------- */
const ICONS={
 walk:'<path d="M4 20 L10 12 L7 8 L13 8 L11 4 L16 4 L14 10 L18 14 L12 20 Z" fill="{c}"/>',
 cat:'<circle cx="8" cy="10" r="5" fill="{c}"/><circle cx="16" cy="10" r="5" fill="{c}"/><path d="M6 5 L8 9 M18 5 L16 9" stroke="{c}" stroke-width="1.5"/>',
 film:'<rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="{c}" stroke-width="1.5"/><line x1="8" y1="5" x2="8" y2="19" stroke="{c}"/><line x1="16" y1="5" x2="16" y2="19" stroke="{c}"/>',
 podcast:'<circle cx="12" cy="13" r="5" fill="none" stroke="{c}" stroke-width="1.5"/><path d="M9 4 L15 4 M12 2 L12 4" stroke="{c}" stroke-width="1.5"/><path d="M10 18 Q12 22 14 18" stroke="{c}" stroke-width="1.5" fill="none"/>',
 coffee:'<path d="M5 9 H17 V15 a4 4 0 0 1 -4 4 H9 a4 4 0 0 1 -4 -4 Z" fill="none" stroke="{c}" stroke-width="1.5"/><path d="M17 11 h2 a2 2 0 0 1 0 4 h-2" fill="none" stroke="{c}" stroke-width="1.5"/>',
 game:'<rect x="3" y="8" width="18" height="9" rx="3" fill="none" stroke="{c}" stroke-width="1.5"/><line x1="8" y1="8" x2="8" y2="17" stroke="{c}"/><line x1="16" y1="8" x2="16" y2="17" stroke="{c}"/><circle cx="5.5" cy="12" r="1" fill="{c}"/><circle cx="18.5" cy="12" r="1" fill="{c}"/>',
 report:'<rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="{c}" stroke-width="1.5"/><line x1="8" y1="8" x2="16" y2="8" stroke="{c}"/><line x1="8" y1="12" x2="16" y2="12" stroke="{c}"/><line x1="8" y1="16" x2="13" y2="16" stroke="{c}"/>',
 json:'<polyline points="9 8 6 12 9 16" fill="none" stroke="{c}" stroke-width="1.5"/><polyline points="15 8 18 12 15 16" fill="none" stroke="{c}" stroke-width="1.5"/>',
 card:'<rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="{c}" stroke-width="1.5"/><line x1="7" y1="10" x2="11" y2="10" stroke="{c}"/><line x1="7" y1="13" x2="14" y2="13" stroke="{c}"/>',
 local:'<rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="{c}" stroke-width="1.5"/><path d="M8 11 V8 a4 4 0 0 1 8 0 V11" fill="none" stroke="{c}" stroke-width="1.5"/>',
 book:'<path d="M5 4 h11 a2 2 0 0 1 2 2 v14 H7 a2 2 0 0 0 -2 2 Z" fill="none" stroke="{c}" stroke-width="1.5"/><line x1="9" y1="8" x2="15" y2="8" stroke="{c}"/>',
 social:'<circle cx="6" cy="12" r="2.5" fill="none" stroke="{c}" stroke-width="1.5"/><circle cx="18" cy="6" r="2.5" fill="none" stroke="{c}" stroke-width="1.5"/><circle cx="18" cy="18" r="2.5" fill="none" stroke="{c}" stroke-width="1.5"/><line x1="8" y1="11" x2="16" y2="7" stroke="{c}"/><line x1="8" y1="13" x2="16" y2="17" stroke="{c}"/>',
 default:'<rect x="5" y="5" width="14" height="14" rx="3" fill="none" stroke="{c}" stroke-width="1.5"/>'
};
function svgIcon(kind,color){return '<svg viewBox="0 0 24 24" width="100%" height="100%">'+(ICONS[kind]||ICONS.default).replace(/\{c\}/g,color)+'</svg>';}

/* ---------- 雷达 ---------- */
function radar(skills,t){
 const n=skills.length,cx=130,cy=130,R=90;let rings="";
 for(const rr of [0.25,0.5,0.75,1.0]){
   let poly=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;poly.push((cx+R*rr*Math.cos(a)).toFixed(1)+","+(cy+R*rr*Math.sin(a)).toFixed(1));}
   rings+='<polygon points="'+poly.join(" ")+'" fill="none" stroke="'+t.line+'"/>';
 }
 let axes="";for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a)).toFixed(1)+'" stroke="'+t.line+'"/>';}
 let pts=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,v=skills[i][1];pts.push([cx+R*v*Math.cos(a),cy+R*v*Math.sin(a)]);}
 const dpoly=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
 const data='<polygon points="'+dpoly+'" fill="'+t.accent+'33" stroke="'+t.accent+'" stroke-width="2"/>';
 const dots=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+t.accent+'"/>').join("");
 let labels="";for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const lx=cx+(R+16)*Math.cos(a),ly=cy+(R+16)*Math.sin(a);labels+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" fill="'+t.muted+'" font-size="10" text-anchor="middle">'+skills[i][0]+'</text>';}
 return '<svg viewBox="0 0 260 260" width="100%" style="max-width:300px">'+rings+axes+data+dots+labels+'</svg>';
}

/* ---------- 七组件内容块 ---------- */
function hHero(P,t){const v=P.vibes.map(x=>'<span>'+x+'</span>').join('');return '<div class="c-hero"><div class="hero-name">'+P.name+'</div><div class="hero-title">'+P.title+'</div><div class="hero-slogan">'+P.slogan+'</div><div class="hero-vibes">'+v+'</div></div>';}
function hStats(P,t){return '<div class="c-stats">'+P.stats.map(s=>'<div class="c-stat"><b>'+s[0]+'</b><span class="num">'+s[1]+'</span><span class="unit">'+s[2]+'</span></div>').join('')+'</div>';}
function hTimeline(P,t){return '<div class="c-tl">'+P.timeline.map(r=>'<div class="tl-row"><div class="tl-year">'+r[0]+'</div><div class="tl-work"><i>事业</i>'+r[1]+'</div><div class="tl-life"><i>生活</i>'+r[2]+'</div></div>').join('')+'</div>';}
function hBento(P,t){return '<div class="c-bento">'+P.bento.map(b=>'<div class="c-bento-item"><div class="b-ico">'+svgIcon(b[2],t.accent)+'</div><div class="b-title">'+b[0]+'</div><div class="b-note">'+b[1]+'</div></div>').join('')+'</div>';}
function hSkills(P,t){const lg=P.skills.map(s=>'<div class="sk-row"><span>'+s[0]+'</span><div class="sk-bar"><i style="width:'+Math.round(s[1]*100)+'%"></i></div></div>').join('');return '<div class="c-skills">'+radar(P.skills,t)+'<div class="sk-legend">'+lg+'</div></div>';}
function hTesti(P,t){return '<div class="c-testi">'+P.testimonials.map(x=>'<div class="c-testi-card"><div class="t-text">'+x[1]+'</div><div class="t-meta"><span class="t-who">'+x[0]+'</span><span class="t-tag">'+x[2]+'</span></div></div>').join('')+'</div>';}
function hContact(P,t){return '<div class="c-contact">'+P.contacts.map(c=>'<div class="c-contact-row"><div class="cc-ch">'+c[0]+'</div><div class="cc-id">'+c[1]+'</div><div class="cc-ice">'+c[2]+'</div></div>').join('')+'</div>';}
function section(num,title,inner,t,cls){return '<section class="exhibit '+(cls||'')+'"><div class="exh-label" style="color:'+t.accent2+'">Exhibit '+String(num).padStart(2,'0')+' · '+title+'</div>'+inner+'</section>';}
function fill(raw,t){for(const k in t){if(typeof t[k]==='string')raw=raw.replace(new RegExp('\\[\\['+k+'\\]\\]','g'),t[k]);}return raw;}

/* ---------- 6 套布局 ---------- */
function layoutA(P,t){
 const css=`.page{max-width:680px;margin:0 auto;padding:24px 18px 80px}
 .exhibit{margin:30px 0;background:[[surface]];border:1px solid [[line]];border-radius:[[radius]];padding:22px}
 .exh-label{font-size:12px;letter-spacing:2px;margin-bottom:14px;font-weight:700}
 .hero-name{font-size:34px;font-weight:800;color:[[ink]]}
 .hero-title{font-size:16px;color:[[accent]];margin:4px 0 10px;font-weight:700}
 .hero-slogan{font-size:15px;color:[[muted]];line-height:1.7}
 .hero-vibes{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
 .hero-vibes span{background:[[tag]];color:[[ink]];font-size:12px;padding:5px 11px;border-radius:20px}
 .c-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
 .c-stat{background:[[tag]];border-radius:12px;padding:12px;text-align:center}
 .c-stat b{display:block;font-size:12px;color:[[muted]]}
 .c-stat .num{font-size:24px;font-weight:800;color:[[accent]]}
 .c-stat .unit{font-size:11px;color:[[muted]]}
 .c-tl .tl-row{display:grid;grid-template-columns:54px 1fr 1fr;gap:10px;padding:12px 0;border-bottom:1px dashed [[line]]}
 .tl-year{font-weight:800;color:[[accent]]}
 .tl-work i,.tl-life i{font-style:normal;font-size:10px;color:[[muted]];display:block;margin-bottom:2px}
 .c-bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
 .c-bento-item{background:[[tag]];border-radius:12px;padding:14px}
 .b-ico{width:34px;height:34px;margin-bottom:8px}
 .b-title{font-weight:700;color:[[ink]]}
 .b-note{font-size:12px;color:[[muted]];margin-top:4px;line-height:1.5}
 .c-skills{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
 .sk-legend{flex:1;min-width:200px}
 .sk-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;color:[[ink]]}
 .sk-bar{flex:1;height:7px;background:[[line]];border-radius:4px;overflow:hidden}
 .sk-bar i{display:block;height:100%;background:[[accent]]}
 .c-testi{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .c-testi-card{background:[[tag]];border-radius:12px;padding:14px}
 .t-text{font-size:14px;color:[[ink]];line-height:1.6}
 .t-meta{margin-top:8px;display:flex;justify-content:space-between;font-size:11px}
 .t-who{color:[[accent]];font-weight:700}.t-tag{color:[[muted]]}
 .c-contact-row{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;padding:10px 0;border-bottom:1px solid [[line]]}
 .cc-ch{font-weight:700;color:[[accent]]}.cc-id{font-size:13px;color:[[ink]]}.cc-ice{grid-column:2;font-size:12px;color:[[muted]]}
 @media(max-width:480px){.c-stats,.c-bento,.c-testi{grid-template-columns:1fr}}`;
 const body='<div class="page">'+section(1,'身份 · HeroCard',hHero(P,t),t)+section(2,'数据 · StatsBoard',hStats(P,t),t)+section(3,'时间轴 · TimelinePro',hTimeline(P,t),t)+section(4,'兴趣 · BentoGallery',hBento(P,t),t)+section(5,'技能 · SkillRadar',hSkills(P,t),t)+section(6,'朋友说 · Testimonial',hTesti(P,t),t)+section(7,'联系 · ContactSocial',hContact(P,t),t)+'</div>';
 return [fill(css,t),fill(body,t)];
}
function layoutB(P,t){
 const css=`.wrap{display:flex;gap:0;max-width:960px;margin:0 auto;min-height:100vh}
 .side{position:sticky;top:0;align-self:flex-start;width:300px;height:100vh;background:[[surface]];border-right:1px solid [[line]];padding:32px 24px;overflow:auto}
 .main{flex:1;padding:32px 28px}
 .hero-name{font-size:30px;font-weight:800;color:[[ink]]}
 .hero-title{font-size:15px;color:[[accent]];margin:6px 0 14px;font-weight:700}
 .hero-slogan{font-size:14px;color:[[muted]];line-height:1.7}
 .hero-vibes{margin-top:16px;display:flex;flex-wrap:wrap;gap:7px}
 .hero-vibes span{background:[[tag]];color:[[muted]];font-size:11px;padding:4px 10px;border-radius:14px}
 .side .c-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
 .c-stat{background:[[tag]];border-radius:8px;padding:9px;text-align:center}
 .c-stat b{display:block;font-size:10px;color:[[muted]]}.c-stat .num{font-size:20px;font-weight:800;color:[[accent]]}
 .side .c-contact{margin-top:20px}
 .c-contact-row{padding:8px 0;border-bottom:1px solid [[line]];font-size:12px}
 .cc-ch{color:[[accent]];font-weight:700}.cc-id{color:[[ink]]}.cc-ice{color:[[muted]];font-size:11px;margin-top:2px}
 .block{margin-bottom:34px}
 .block h3{font-size:13px;letter-spacing:2px;color:[[accent]];border-left:3px solid [[accent]];padding-left:10px;margin-bottom:14px}
 .c-tl .tl-row{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed [[line]]}
 .tl-year{font-weight:800;color:[[accent]]}.tl-work i,.tl-life i{font-style:normal;font-size:10px;color:[[muted]];margin-right:6px}
 .c-bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .c-bento-item{background:[[tag]];border-radius:10px;padding:12px}
 .b-ico{width:30px;height:30px;margin-bottom:6px}.b-title{font-weight:700;color:[[ink]];font-size:14px}.b-note{font-size:11px;color:[[muted]];margin-top:3px}
 .c-skills{display:flex;gap:16px;flex-wrap:wrap;align-items:center}.sk-legend{flex:1;min-width:180px}
 .sk-row{display:flex;align-items:center;gap:8px;font-size:12px;color:[[ink]];margin:5px 0}.sk-bar{flex:1;height:6px;background:[[line]];border-radius:3px;overflow:hidden}.sk-bar i{display:block;height:100%;background:[[accent]]}
 .c-testi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c-testi-card{background:[[tag]];border-radius:10px;padding:12px}
 .t-text{font-size:13px;color:[[ink]];line-height:1.5}.t-meta{margin-top:7px;display:flex;justify-content:space-between;font-size:10px}.t-who{color:[[accent]];font-weight:700}.t-tag{color:[[muted]]}
 @media(max-width:720px){.wrap{flex-direction:column}.side{position:relative;width:auto;height:auto;border-right:none;border-bottom:1px solid [[line]]}}`;
 const body='<div class="wrap"><aside class="side">'+hHero(P,t)+hStats(P,t)+hContact(P,t)+'</aside><main class="main"><div class="block"><h3>TIMELINE · 双轨</h3>'+hTimeline(P,t)+'</div><div class="block"><h3>BENTO · 兴趣</h3>'+hBento(P,t)+'</div><div class="block"><h3>SKILLS · 雷达</h3>'+hSkills(P,t)+'</div><div class="block"><h3>FRIENDS · 朋友说</h3>'+hTesti(P,t)+'</div></main></div>';
 return [fill(css,t),fill(body,t)];
}
function layoutC(P,t){
 const css=`.page{max-width:760px;margin:0 auto;padding:20px 14px 70px}
 .bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(90px,auto);gap:12px}
 .cell{background:[[surface]];border:1px solid [[line]];border-radius:[[radius]];padding:16px;overflow:hidden}
 .cell.hero{grid-column:span 4;background:[[accent]];color:#000}
 .cell.hero .hero-name{font-size:30px;font-weight:800}.cell.hero .hero-title{color:#000;opacity:.7;font-weight:700;margin:4px 0}.cell.hero .hero-slogan{font-size:14px;opacity:.85;line-height:1.6}
 .cell.hero .hero-vibes{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}.cell.hero .hero-vibes span{background:#00000022;color:#000;font-size:11px;padding:4px 9px;border-radius:12px}

/* ---------- 渲染（预览 + 下载用） ---------- */
function render(){const html=buildHTML(P,CUR);document.getElementById('pv').srcdoc=html;window._last=html;}
function initThemes(){const c=document.getElementById('themes');THEMES.forEach(t=>{const b=el('button',null,t.name);if(t.id===CUR)b.className='on';b.onclick=()=>{CUR=t.id;[...c.children].forEach(x=>x.className='');b.className='on';render();};c.appendChild(b);});}
document.getElementById('loadDemo').onclick=()=>{P=JSON.parse(JSON.stringify(DEMO));buildForm();render();};
document.getElementById('download').onclick=()=>{const html=buildHTML(P,CUR);const blob=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(P.name||'social-card')+'_'+CUR+'.html';a.click();URL.revokeObjectURL(a.href);};
initThemes();buildForm();render();
</script>
